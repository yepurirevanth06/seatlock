spring:
  application:
    name: seatlock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seatlock}
    username: ${DB_USER:seatlock}
    password: ${DB_PASSWORD:seatlock}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    ttl-minutes: 120
  holds:
    ttl-seconds: ${HOLD_TTL_SECONDS:300}
    max-seats: 6
  seed-demo-data: ${SEED_DEMO_DATA:true}
  cors-origins: "${CORS_ORIGINS:http://localhost:*}"
  mail-from: ${MAIL_FROM:tickets@seatlock.dev}
  outbox-poll-ms: ${OUTBOX_POLL_MS:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
